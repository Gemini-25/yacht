name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: ./gradlew :engine:test --console=plain

      - name: Generate solver tables
        run: |
          ./gradlew :tools:installDist --console=plain
          tools/build/install/tools/bin/tools gen --out android/app/src/main/assets

      - name: Build APK
        run: ./gradlew -p android :app:assembleRelease --console=plain

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/yacht-ai-${GITHUB_SHA::7}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yacht-ai-apk
          path: out/*.apk
          compression-level: 0

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Korean fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: Generate solver tables
        run: |
          ./gradlew :tools:installDist --console=plain
          tools/build/install/tools/bin/tools gen --out tables

      - name: Render UI screenshots
        timeout-minutes: 12
        env:
          PRINT_SHOTS: "1"
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: |
          ./gradlew -p uicheck installDist --console=plain
          uicheck/build/install/uicheck/bin/uicheck tables shots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/*.png
