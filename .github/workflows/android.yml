name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "prototype/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: ./gradlew :engine:test --console=plain

      - name: Generate solver tables
        run: |
          ./gradlew :tools:installDist --console=plain
          tools/build/install/tools/bin/tools gen --out android/app/src/main/assets

      - name: Build APK
        run: ./gradlew -p android :app:assembleRelease --console=plain

      - name: Rename APKs
        run: |
          mkdir -p out/next out/classic
          cp android/app/build/outputs/apk/next/release/app-next-release.apk out/next/yacht-ai2-${GITHUB_SHA::7}.apk
          cp android/app/build/outputs/apk/classic/release/app-classic-release.apk out/classic/yacht-ai-classic-${GITHUB_SHA::7}.apk

      # "요트 AI 2": its own app next to the earlier one.
      - uses: actions/upload-artifact@v4
        with:
          name: yacht-ai2-apk
          path: out/next/*.apk
          compression-level: 0

      # The earlier "요트 AI" updated in place (keeps its records; can back them up for 요트 AI 2).
      - uses: actions/upload-artifact@v4
        with:
          name: yacht-ai-classic-apk
          path: out/classic/*.apk
          compression-level: 0

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Korean fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: Generate solver tables
        run: |
          ./gradlew :tools:installDist --console=plain
          tools/build/install/tools/bin/tools gen --out tables

      - name: Render UI screenshots
        timeout-minutes: 12
        env:
          PRINT_SHOTS: "1"
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: |
          ./gradlew -p uicheck installDist --console=plain
          uicheck/build/install/uicheck/bin/uicheck tables shots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/*.png
